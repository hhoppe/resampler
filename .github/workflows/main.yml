name: Build, test, and publish Python distributions to PyPI

# My strategy is test, build, and publish on all push events to main.  The publish step skips the
# upload if PyPI already has this version, so a release happens when __version__ is bumped.
# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored in the repository.

on:
  push:
    branches: [main]
    # tags: "v*.*.*"  # Tag push is not associated with a branch, so OR this.
  pull_request:
    branches: [main]
  schedule:
    # Also detect breakage from new releases of Python, the dependencies, and the lint tools.
    - cron: '0 11 * * 0'  # Weekly on Sunday at 11:00 UTC.
  workflow_dispatch:

# Security: restrict permissions for CI jobs.
permissions:
  contents: read

concurrency:
  # Include the event, so that a push does not cancel a scheduled run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate code
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false  # Report the results for every configuration.
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.x']
        include:
          - os: windows-latest
            python-version: '3.x'
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the package and the test requirements
      run: pip install . --group test

    - name: Run tests including doctest
      run: pytest  # The options, including --doctest-modules, are in pyproject.toml.

  test-min:
    name: Test with the minimum dependency versions (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install uv, whose resolver can select the lowest allowed versions
      run: pip install uv

    - name: Install the package and the test requirements, with the dependencies at their lower bounds
      run: |
        uv pip compile pyproject.toml --python-version 3.10 --resolution lowest-direct \
          --only-binary numpy,scipy -o min.txt
        cat min.txt
        uv pip install --system . --group test -c min.txt

    - name: Run tests including doctest
      run: pytest

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        # Not '3.x', which becomes 3.15 in October 2026: torch, numba, and scikit-image lack wheels for it,
        # and pylint's parallel mode (-j) fails on it (co_lnotab was removed).
        # Return to '3.x' once they support 3.15.
        python-version: '3.14'

    - name: Install CPU-only torch, which is much smaller than the default CUDA build
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Install the package, the lint tools, and the optional imports
      run: pip install . --group lint

    - name: Run pyink
      run: pyink --check --diff .

    - name: Run ruff
      run: ruff check .

    - name: Run mypy
      run: mypy

    - name: Run pyrefly
      run: pyrefly check

    - name: Run pylint
      run: pylint -j0 .

    - name: Run stubtest
      run: python -m mypy.stubtest resampler --allowlist stubtest_allowlist.txt --mypy-config-file pyproject.toml

  test-backends:
    name: Test with the optional backends (numba, jax, torch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        # Not '3.x', which becomes 3.15 in October 2026: torch and numba lack wheels for it.
        # Return to '3.x' once they support 3.15.
        python-version: '3.14'

    - name: Install CPU-only torch, which is much smaller than the default CUDA build
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Install the package, the test requirements, and the optional backends
      run: pip install . --group test --group backends

    - name: Run tests including doctest
      run: pytest

  notebook:
    name: Run the example and the notebook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        # Not '3.x', which becomes 3.15 in October 2026: torch, numba, and scikit-image lack wheels for it.
        # Return to '3.x' once they support 3.15.
        python-version: '3.14'

    - name: Install CPU-only torch, which is much smaller than the default CUDA build
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Install ffmpeg, which mediapy uses to show videos
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install the package and the imports of the notebook
      run: pip install . --group notebook

    - name: Run example_usage.py
      run: python example_usage.py

    - name: Run resampler_notebook.py, whose assertions check the results
      env:
        EFFORT: 1  # Levels range from 0 (quickest) to 3; the default is 2.
      run: python resampler_notebook.py

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.x
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install the package and pdoc
      run: pip install . pdoc

    - name: Build the documentation into pdoc_files/html/
      run: python pdoc_files/make.py

    - uses: actions/upload-pages-artifact@v5
      with:
        path: pdoc_files/html/

  deploy-docs:
    name: Deploy the documentation to GitHub Pages
    # Deploy for pushes and manual runs on main (not for pull requests or scheduled runs), and only
    # after the tests pass.  This separate job alone gets the permissions that deploy-pages needs.
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    needs: [validate, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:  # Let a deployment in progress finish, as GitHub recommends for Pages.
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5

  publish:
    name: Publish to PyPI
    # if: github.repository == 'hhoppe/some_repo'
    # if: startsWith(github.ref, 'refs/tags/v')
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, test-backends]  # Not lint or notebook, so that tool releases or flaky downloads cannot block it.
    environment: pypi
    permissions:
      contents: write  # Required to create the release tag.
      id-token: write  # Required for Trusted Publishing.
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.x
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Build a binary wheel and a source tarball
      run: |
        python -m pip install build --user
        python -m build --sdist --wheel --outdir dist/ .

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true  # Succeed without uploading if PyPI already has this version.

    - name: Create a GitHub release, with tag v<version>, for a new version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(basename dist/*.tar.gz .tar.gz)  # The sdist is <name>-<version>.tar.gz.
        tag=v${version##*-}
        if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
          echo "Tag $tag already exists."
        else
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
        fi
